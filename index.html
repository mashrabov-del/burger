<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style1.css">
    <title>burger</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;0,800;0,900;1,800&display=swap');
        body{
            background: linear-gradient(145deg, #1f1f1f, #0d0d0d);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            margin: 0;
        }
        .ass{
            display: flex;
            align-items: center;
            position: relative;
            width: 740px;
            height: 440px;
            background: linear-gradient(135deg, #1e1b4b 0%, #311038 50%, #4c0519 100%);
            border-radius: 16px;
            border: 2px solid #ff2a5f;
            box-shadow: 0 10px 30px rgba(255, 42, 95, 0.4);
            overflow: hidden;
            padding: 40px;
            box-sizing: border-box;
        }
        .ass img.burger-img{
            width: 240px;
            height: 280px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.8));
            transform: scale(1.1) rotate(-4deg);
            flex-shrink: 0;
            z-index: 2;
        }
        .content-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: 30px;
            z-index: 2;
        }
        .ass p{
            font-size: 28px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
            margin: 0 0 25px 0;
        }
        .ass a {
            display: inline-block;
            text-decoration: none;
            width: fit-content;
        }
        .ass button{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 230px;
            height: 52px;
            border-radius: 26px;
            background: linear-gradient(135deg, #ff2a5f 0%, #ffa42a 100%);
            border: none;
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
            font-style: var(--font-style, italic);
            font-weight: 900;
            font-size: 15px;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.5);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .ass button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        .ass button:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(255, 164, 42, 0.7);
        }
        .ass button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div class="ass">
     
       <img class="burger-img" src="/burger.jfif" alt="Burger">
        <div class="content-box">
            <p>Bir tishlasang,<br>tamom — to'xtay olmaysan!</p>
            <a href="https://uzumtezkor.uz" target="_blank">
                <button>
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-5H8l4-7v5h3l-4 7z"/>
                    </svg>
                    Buyurtma berish
                </button>
            </a>
        </div>
    </div>
</body>
</html>
